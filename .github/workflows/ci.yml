name: Build and Deploy to AWS EKS

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    name: Build Java App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven (Skip Tests)
        run: mvn -B clean package -DskipTests --file pom.xml

      - name: Upload build artifact
        uses: actions/upload-artifact@v3
        with:
          name: app-jar
          path: target/*.jar

  dockerize:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v3
        with:
          name: app-jar

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to AWS ECR
        run: |
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin ${{ secrets.AWS_ECR_REPO }}

      - name: Build and Tag Docker Image
        run: |
          docker build -t user-service:latest .
          docker tag user-service:latest ${{ secrets.AWS_ECR_REPO }}:latest

      - name: Push Docker Image to ECR
        run: docker push ${{ secrets.AWS_ECR_REPO }}:latest

  deploy:
    name: Deploy to AWS EKS
    runs-on: ubuntu-latest
    needs: dockerize

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Update kubeconfig
        run: aws eks --region us-east-1 update-kubeconfig --name my-cluster

      - name: Apply Kubernetes Manifests
        run: |
          kubectl apply -f deployment/postgres-secrets.yaml
          kubectl apply -f deployment/deployment.yaml

      - name: Wait for Deployment Rollout
        run: kubectl rollout status deployment/user-service
